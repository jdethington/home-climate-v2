<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Climate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem;
        }

        .rec-open {
            color: green;
        }

        .rec-closed {
            color: #b00;
        }

        .cards {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            min-width: 200px;
        }

        canvas {
            max-height: 260px;
        }
    </style>
</head>

<body>
    <h1>Home Climate</h1>
    <p>Recommendation: <strong id="recommendation">…</strong>
        <button id="unit-toggle">°C / °F</button>
    </p>
    <div class="cards" id="cards"></div>
    <div id="charts"></div>
    <script>
        let unit = localStorage.getItem("homeclimate-unit") || "C";
        let sensors = [];
        const charts = {};

        const toDisplay = (c) => c === null ? "—" : (unit === "F" ? (c * 9 / 5 + 32) : c).toFixed(1);
        const unitLabel = () => unit === "F" ? "°F" : "°C";
        const fmtTime = (ts) => new Date(ts).toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

        async function loadStatus() {
            const data = await (await fetch("/api/status")).json();
            const rec = document.getElementById("recommendation");
            rec.textContent = data.recommendation;
            rec.className = data.recommendation === "OPEN" ? "rec-open" : "rec-closed";
            sensors = data.sensors;
            const cards = document.getElementById("cards");
            cards.innerHTML = "";
            sensors.forEach((s) => {
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `<h2>${s.node_id}</h2>
      <p>${toDisplay(s.temp_c)}${unitLabel()} &nbsp; ${s.humidity === null ? "—" : s.humidity + "% RH"}</p>
      <p>Battery: ${s.batt_v === null ? "—" : s.batt_v.toFixed(2) + " V"} &nbsp; FW ${s.fw_version}</p>
      <p>Last seen: ${new Date(s.ts).toLocaleString()}</p>`;
                cards.appendChild(div);
            });
        }

        async function loadCharts() {
            Object.values(charts).forEach((c) => c.destroy());
            for (const k in charts) delete charts[k];
            document.getElementById("charts").innerHTML = "";
            for (const s of sensors) {
                const rows = await (await fetch(`/api/history?node_id=${s.node_id}&hours=24`)).json();
                const el = document.createElement("canvas");
                document.getElementById("charts").appendChild(el);
                charts[s.node_id] = new Chart(el, {
                    type: "line",
                    data: {
                        labels: rows.map((r) => fmtTime(r.ts)),
                        datasets: [
                            { label: "Temp " + unitLabel(), data: rows.map((r) => r.temp_c === null ? null : (unit === "F" ? r.temp_c * 9 / 5 + 32 : r.temp_c)), borderColor: "red", yAxisID: "y" },
                            { label: "Humidity %", data: rows.map((r) => r.humidity), borderColor: "blue", yAxisID: "y1" },
                        ],
                    },
                    options: { responsive: true, scales: { y: { position: "left" }, y1: { position: "right", min: 0, max: 100 } } },
                });
            }
        }

        document.getElementById("unit-toggle").addEventListener("click", () => {
            unit = unit === "C" ? "F" : "C";
            localStorage.setItem("homeclimate-unit", unit);
            loadStatus();
            loadCharts();
        });

        loadStatus().then(() => loadCharts());
        setInterval(loadStatus, 30000);            // live numbers every 30s
        setInterval(loadCharts, 5 * 60 * 1000);    // graphs every 5 min
    </script>
</body>

</html>

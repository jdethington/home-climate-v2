<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Climate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem;
        }

        .rec-open {
            color: green;
        }

        .rec-closed {
            color: #b00;
        }

        .cards {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            min-width: 200px;
        }

        .alert-banner {
            background: #fff3cd;
            border: 1px solid #e6c200;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
        }

        canvas {
            max-height: 260px;
        }
    </style>
</head>

<body>
    <h1>Home Climate</h1>
    <p>Recommendation: <strong id="recommendation">…</strong>
        <button id="unit-toggle">°C / °F</button>
        <button id="update-now">Update Now</button>
    </p>
    <div id="alerts"></div>
    <ul id="reasons"></ul>
    <div class="cards" id="cards"></div>
    <div id="charts"></div>
    <script>
        let unit = localStorage.getItem("homeclimate-unit") || "C";
        let sensors = [];
        const charts = {};
        let lastStatus = null;
        // Nodes with an OTA update in flight (clicked Update, waiting for ota_ready).
        const pendingUpdates = new Set();
        const otaPollers = {};
        const OTA_FRESH_MS = 10 * 60 * 1000; // the node's OTA window

        function freshOtaStatus(nodeId, statuses) {
            const st = (statuses || []).find((x) => x.node_id === nodeId);
            if (!st || st.status !== "ota_ready" || !st.ip) return null;
            if (Date.now() - new Date(st.ts).getTime() > OTA_FRESH_MS) return null;
            return st;
        }

        // Compare two dotted versions numerically, segment by segment.
        // Returns 1 if a > b, -1 if a < b, 0 if equal. "1.1.10" > "1.1.9".
        function compareVersions(a, b) {
            const pa = (a || "").split(".").map(Number);
            const pb = (b || "").split(".").map(Number);
            const n = Math.max(pa.length, pb.length);
            for (let i = 0; i < n; i++) {
                const x = pa[i] || 0;
                const y = pb[i] || 0;
                if (x !== y) return x > y ? 1 : -1;
            }
            return 0;
        }

        const toDisplay = (c) => c === null ? "—" : (unit === "F" ? (c * 9 / 5 + 32) : c).toFixed(1);
        // Reasons arrive in Celsius. In °F mode, convert the numbers —
        // absolute temperatures (13.4C -> 56.1F) and differences (10.8C
        // cooler -> 19.4F cooler) use different math, so tell them apart
        // by what follows/precedes the number.
        function convertReason(reason) {
            if (unit === "C") return reason;
            return reason.replace(/(-?\d+(?:\.\d+)?)C/g, (match, num, offset, str) => {
                const value = parseFloat(num);
                const after = str.slice(offset + match.length);
                const before = str.slice(0, offset);
                const isDiff = /^( cooler| warmer)/.test(after)
                    || /(margin|hold|open) $/.test(before);
                const f = isDiff ? value * 9 / 5 : value * 9 / 5 + 32;
                return f.toFixed(1) + "F";
            });
        }

        const unitLabel = () => unit === "F" ? "°F" : "°C";
        const fmtTime = (ts) => new Date(ts).toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

        async function loadStatus() {
            const data = await (await fetch("/api/status")).json();
            lastStatus = data;
            const rec = document.getElementById("recommendation");
            rec.textContent = data.recommendation;
            rec.className = data.recommendation === "OPEN" ? "rec-open" : "rec-closed";
            const reasonsEl = document.getElementById("reasons");
            reasonsEl.innerHTML = "";
            (data.reasons || []).forEach((r) => {
                const li = document.createElement("li");
                li.textContent = convertReason(r);
                reasonsEl.appendChild(li);
            });
            const alertsEl = document.getElementById("alerts");
            alertsEl.innerHTML = "";
            (data.alerts || []).forEach((a) => {
                const div = document.createElement("div");
                div.className = "alert-banner";
                const text = a.headline ? `${a.event} — ${a.headline}` : a.event;
                const until = a.expires ? ` (until ${fmtTime(a.expires)})` : "";
                div.textContent = text + until;
                alertsEl.appendChild(div);
            });
            const nodeStatus = data.node_status || [];
            const latestFw = data.latest_fw_version;
            sensors = data.sensors;
            const cards = document.getElementById("cards");
            cards.innerHTML = "";
            sensors.forEach((s) => {
                const ota = freshOtaStatus(s.node_id, nodeStatus);
                const pending = pendingUpdates.has(s.node_id);
                const updateAvailable = latestFw && compareVersions(s.fw_version, latestFw) < 0;
                let otaHtml;
                if (ota) {
                    otaHtml = `<p>Updating to ${latestFw}…</p>`;
                } else if (pending) {
                    otaHtml = `<p>Waiting for node… (up to 5 min)</p>`;
                } else if (updateAvailable) {
                    otaHtml = `<button data-update="${s.node_id}">Update to ${latestFw}</button>`;
                } else {
                    otaHtml = `<p>Up to date</p>`;
                }
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <h2>${s.node_id}</h2>
                    <p>${toDisplay(s.temp_c)}${unitLabel()} &nbsp; ${s.humidity === null ? "—" : s.humidity + "% RH"}</p>
                    <p>Battery: ${s.batt_v === null ? "—" : s.batt_v.toFixed(2) + " V"} &nbsp; FW ${s.fw_version}</p>
                    <p>Last seen: ${new Date(s.ts).toLocaleString()}</p>
                    ${otaHtml}`;
                cards.appendChild(div);
            });
        }

        async function loadCharts() {
            Object.values(charts).forEach((c) => c.destroy());
            for (const k in charts) delete charts[k];
            document.getElementById("charts").innerHTML = "";
            for (const s of sensors) {
                const rows = await (await fetch(`/api/history?node_id=${s.node_id}&hours=24`)).json();
                const el = document.createElement("canvas");
                document.getElementById("charts").appendChild(el);
                charts[s.node_id] = new Chart(el, {
                    type: "line",
                    data: {
                        labels: rows.map((r) => fmtTime(r.ts)),
                        datasets: [
                            { label: "Temp " + unitLabel(), data: rows.map((r) => r.temp_c === null ? null : (unit === "F" ? r.temp_c * 9 / 5 + 32 : r.temp_c)), borderColor: "red", yAxisID: "y" },
                            { label: "Humidity %", data: rows.map((r) => r.humidity), borderColor: "blue", yAxisID: "y1" },
                        ],
                    },
                    options: { responsive: true, scales: { y: { position: "left" }, y1: { position: "right", min: 0, max: 100 } } },
                });
            }
        }

        // Intervals run from the last update (manual or automatic), not from page load.
        // 5.1 min sits just past the nodes' 5-min send cycle, so each poll catches
        // the newest reading instead of landing in lockstep with it.
        const STATUS_INTERVAL_MS = 5.1 * 60 * 1000;
        const CHARTS_INTERVAL_MS = 15 * 60 * 1000;
        let statusTimer = null;
        let chartsTimer = null;

        function scheduleStatus() {
            clearTimeout(statusTimer);
            statusTimer = setTimeout(async () => {
                try {
                    await loadStatus();
                } catch (e) {
                    console.error(e);
                }
                scheduleStatus();
            }, STATUS_INTERVAL_MS);
        }

        function scheduleCharts() {
            clearTimeout(chartsTimer);
            chartsTimer = setTimeout(async () => {
                try {
                    await loadCharts();
                } catch (e) {
                    console.error(e);
                }
                scheduleCharts();
            }, CHARTS_INTERVAL_MS);
        }

        async function updateNow() {
            const btn = document.getElementById("update-now");
            btn.disabled = true;
            try {
                await loadStatus();
                await loadCharts();
            } finally {
                btn.disabled = false;
            }
            scheduleStatus();   // restart both clocks from this update
            scheduleCharts();
        }

        function waitForOta(nodeId, targetVersion) {
            if (otaPollers[nodeId]) clearInterval(otaPollers[nodeId]);
            let tries = 0;
            otaPollers[nodeId] = setInterval(async () => {
                tries++;
                try { await loadStatus(); } catch (e) { console.error(e); }
                const s = lastStatus && (lastStatus.sensors || []).find((x) => x.node_id === nodeId);
                const done = s && compareVersions(s.fw_version, targetVersion) >= 0;
                if (done || tries >= 12) {  // 12 x 30s = 6 min
                    clearInterval(otaPollers[nodeId]);
                    delete otaPollers[nodeId];
                    pendingUpdates.delete(nodeId);
                    try { await loadStatus(); } catch (e) { console.error(e); }
                }
            }, 30 * 1000);
        }

        document.getElementById("cards").addEventListener("click", async (e) => {
            const btn = e.target.closest("[data-update]");
            if (!btn) return;
            const nodeId = btn.dataset.update;
            btn.disabled = true;
            try {
                const res = await fetch(`/api/update/${nodeId}`, { method: "POST" });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || "publish failed");
                pendingUpdates.add(nodeId);
                waitForOta(nodeId, lastStatus.latest_fw_version);
                await loadStatus();  // re-render to show "Waiting…"
            } catch (err) {
                alert(`Update failed: ${err.message}`);
                btn.disabled = false;
            }
        });


        document.getElementById("update-now").addEventListener("click", updateNow);

        document.getElementById("unit-toggle").addEventListener("click", () => {
            unit = unit === "C" ? "F" : "C";
            localStorage.setItem("homeclimate-unit", unit);
            updateNow();   // re-renders in the new unit, and restarts both clocks
        });

        // First load, then start both clocks.
        loadStatus().then(() => loadCharts()).then(() => {
            scheduleStatus();
            scheduleCharts();
        });
    </script>
</body>

</html>

# broker host/port, topics
mqtt:
  host: "192.168.0.104"
  port: 1883
  topics:
    - "homeclimate/sensor/#"
    - "homeclimate/status/#"

recommendation:
  open_margin_c: 2.0
  hold_margin_c: 1.0
  dewpoint_margin_c: 1.0
  average_readings: 3

database:
  path: "homeclimate.db"

dashboard:
  port: 5000

firmware:
  dir: "firmware"
  base_url: "http://192.168.0.104:5000/firmware"

ntfy:
  enabled: true
  quiet_start: 22
  quiet_end: 7

nws:
  latitude: 33.3528
  longitude: -111.7890
  poll_interval_minutes: 15
